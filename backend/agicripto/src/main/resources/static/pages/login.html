<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agiCripto - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row vh-100">
        <div class="col-lg-5 col-md-6 d-none d-md-flex flex-column justify-content-between p-5 left-column">
            <div class="logo">
                <img src="./assets/logo1.png" alt="Logo agiCripto" class="img-fluid logo-img">
            </div>

            <div class="header-text">
                <h2 class="display-4 text-white">Lorem ipsum<br>dolor sit <span class="highlight-green">amet</span></h2>
            </div>

            <div class="bar-chart">
                <div class="bar bar-1"></div>
                <div class="bar bar-2"></div>
                <div class="bar bar-3"></div>
                <div class="bar bar-4"></div>
                <div class="bar bar-5"></div>
                <div class="bar bar-6"></div>
                <div class="bar bar-7"></div>
            </div>

            <div></div>
        </div>

        <div class="col-lg-7 col-md-6 d-flex flex-column align-items-center justify-content-center p-4">
            <div class="login-container">
                <div class="w-100 text-center mb-5">
                    <h3 class="welcome-text">Bem vindo de volta!</h3>
                </div>

                <div class="card shadow-lg border-0 rounded-4 p-4">
                    <div class="card-body">
                        <h2 class="card-title text-center fw-bold mb-4 login-title">Login</h2>
                        <form>
                            <div class="mb-4">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg rounded-3" id="email">
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control form-control-lg rounded-3" id="password">
                            </div>
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Lembrar de mim</label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg btn-login d-flex justify-content-between align-items-center">
                                    <span>Acessar</span>
                                    <span class="arrow">&rarr;</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="../js/login.js"></script>
</body>
</html>
