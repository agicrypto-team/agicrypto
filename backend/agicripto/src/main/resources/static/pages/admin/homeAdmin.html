<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agi Cripto - Admin</title>
    <link rel="stylesheet" href="../../css/homeAdmin.css">
</head>
<body>
    <header class="top-nav">
        <div class="container nav-inner">
            <aside class="sidebar">
                <img src="../../assets/AgiCripto.svg" alt="Logo AgiCripto" class="sidebar-logo">
            </aside>
            <nav class="nav-right">
                <button class="btn-logout">Sair</button>
            </nav>
        </div>
    </header>

    <main class="container">

        <section class="greeting">
            <h1>Olá, <span class="username loading">carregando...</span>!</h1>
        </section>


        <section class="add-transaction" aria-labelledby="add-transacao-title">
            <h2 class="section-subtitle">Cadastrar Nova Criptomoeda</h2>

            <form id="cadastro-form" class="form-grid">

                <div class="form-row">

                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required placeholder="Nome">
                    </div>

                    <div class="form-group">
                        <label for="sigla">Sigla</label>
                        <input type="text" id="sigla" required maxlength="5" placeholder="Sigla">
                    </div>

                    <div class="form-group">
                        <label for="link_imagem">Link da Imagem</label>
                        <input type="url" id="link_imagem" placeholder="Link da Imagem">
                    </div>
                </div>

                <div class="form-action-button">
                    <input type="hidden" id="idResponsavel" name="idResponsavel" value="1">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </section>

        <section class="card table-section">
            <h3 class="section-subtitle">Criptomoedas Cadastradas</h3>
            <table id="cripto-table">
                <thead>
                <tr>
                    <th></th> <th>Nome</th>
                    <th>Sigla</th>
                    <th>Link da Imagem</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>
                        <img src="https://bitcoin.org/img/icons/logo_shadow.png" alt="Bitcoin Icon" class="crypto-icon">
                    </td>
                    <td>Bitcoin</td>
                    <td>BTC</td>
                    <td>https://bitcoin.org</td>
                    <td class="action-buttons">
                        <button class="btn-action btn-edit acao-editar">Editar</button>
                        <button class="btn-delete acao-delete">Excluir</button>
                    </td>
                </tr>
                <tr>
                    <td>
                        <img src="https://ethereum.org/static/298e3b392a884fe06d9536c4b2c14283/222d4/eth-logo.png" alt="Ethereum Icon" class="crypto-icon">
                    </td>
                    <td>Ethereum</td>
                    <td>ETH</td>
                    <td>https://ethereum.org</td>
                    <td class="action-buttons">
                        <button class="btn-action btn-edit acao-editar">Editar</button>
                        <button class="btn-delete acao-delete">Excluir</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </section>

        <!-- Gráfico -->
        <section class="grafico" aria-label="Gráfico de carteira">
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            <canvas id="graficoCotacoes" width="1200" height="420"></canvas>

        </section>
    </main>
    <script src="../../js/homeAdmin.js"></script>
</body>
</html>
